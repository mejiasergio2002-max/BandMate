
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BandMate Role Select</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .container {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      .card {
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 8px;
        padding: 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      select {
        width: 100%;
        padding: 8px 12px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid rgba(0,0,0,0.2);
        background: inherit;
      }
      .output {
        margin-top: 16px;
        font-size: 14px;
        opacity: 0.8;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Role Select</h1>
      <div class="card">
        <label for="role-select">Choose a role</label>
        <select id="role-select">
          <option value="" disabled selected>Select a role</option>
          <option value="artist">Artist</option>
          <option value="viewer">Viewer</option>
        </select>
        <div class="row">
          <button id="clear">Clear</button>
          <button id="copy">Copy value</button>
        </div>
        <div class="output" id="output">Selected: none</div>
      </div>
    </div>
    <script>
      const sel = document.getElementById('role-select');
      const out = document.getElementById('output');
      const clear = document.getElementById('clear');
      const copy = document.getElementById('copy');
      function setFromQuery() {
        const params = new URLSearchParams(location.search);
        const role = params.get('role');
        if (!role) return;
        const allowed = new Set(['artist','viewer']);
        if (allowed.has(role)) sel.value = role;
        render();
      }
      function render() {
        out.textContent = 'Selected: ' + (sel.value || 'none');
      }
      sel.addEventListener('change', render);
      clear.addEventListener('click', () => {
        sel.value = '';
        render();
      });
      copy.addEventListener('click', async () => {
        const value = sel.value;
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          copy.textContent = 'Copied';
          setTimeout(() => copy.textContent = 'Copy value', 1200);
        } catch {}
      });
      setFromQuery();
      render();
    </script>
  </body>
</html>
